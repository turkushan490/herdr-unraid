name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck -S warning rootfs/entrypoint.sh scripts/*.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/herdr-unraid
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: herdr-unraid:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (first start installs herdr, hc, bun, Ovis)
        run: |
          docker run -d --name t -e ENABLE_TTYD=true -e TTYD_CREDENTIAL=t:t herdr-unraid:test
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' t)
            echo "health: $s"; [ "$s" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' t)" = true ] || break
            sleep 10
          done
          docker logs t | tail -80
          docker exec -u herdr t bash -lc 'herdr --version && hc --version && hc ls'
          docker exec t sshd -T | grep -E '^(passwordauthentication|permitrootlogin|compression) '
          test "$(docker inspect -f '{{.State.Health.Status}}' t)" = healthy

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
