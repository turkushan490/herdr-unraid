# herdr-unraid: key-only SSH for user herdr
Port 22
HostKey /config/ssh_host_keys/ssh_host_ed25519_key
HostKey /config/ssh_host_keys/ssh_host_rsa_key

PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers herdr

# herdr clients ask for compression (they pass -C themselves too)
Compression yes
# herdr / hc remote attach use the SSH channel; forwarding lets you tunnel
# the web UI (ssh -L 7317:127.0.0.1:7317) without publishing the port
AllowTcpForwarding yes
AllowAgentForwarding yes
X11Forwarding no

ClientAliveInterval 30
ClientAliveCountMax 6
