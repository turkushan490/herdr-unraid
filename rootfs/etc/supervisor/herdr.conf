[supervisord]
nodaemon=true
user=root
logfile=/var/log/herdr/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; herdr TUI server, headless. Clients: `herdr --remote <host>` / `herdr machine add`
[program:herdr]
command=/scripts/run-herdr.sh
user=herdr
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Ovis web UI (formerly herdr-web-ui). Disabled when ENABLE_WEBUI=false.
[program:webui]
command=/scripts/run-webui.sh
user=herdr
autostart=%(ENV_ENABLE_WEBUI)s
autorestart=true
startsecs=10
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Raw shell in the browser. Disabled when ENABLE_TTYD=false.
[program:ttyd]
command=/scripts/run-ttyd.sh
user=herdr
autostart=%(ENV_ENABLE_TTYD)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
